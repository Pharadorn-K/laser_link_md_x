<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> LASER LINK MD-X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="/css/fontawesome/all.min.css">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  </head>

  <body>
    <div class="app-shell">

      <!-- ================= Sidebar ================= -->
      <nav class="sidebar">
        <div class="sidebar-brand"><span class="beam"></span> LASER LINK MD-X</div>

        <div class="nav-section-label">Overview</div>
        <button class="nav-link" data-page="monitor"><span class="ic"><i class="fa-solid fa-desktop" style="color: rgb(255, 255, 255);"></i></span> Monitor</button>

        <div class="nav-section-label">Marking</div>
        <button class="nav-link" data-page="model_setting"><span class="ic"><i class="fa-solid fa-sliders" style="color: rgb(255, 255, 255);"></i></span> Model Setting</button>
        <button class="nav-link" data-page="add_new_model" data-admin-only="1"><span class="ic"><i class="fa-solid fa-circle-plus" style="color: rgb(255, 255, 255);"></i></span> Add New Model</button>
        <button class="nav-link" data-page="work_mode"><span class="ic"><i class="fa-regular fa-hand-point-right" style="color: rgb(255, 255, 255);"></i></span> Work Mode</button>
        <button class="nav-link" data-page="alarm_center"><span class="ic"><i class="fa-solid fa-bell" style="color: rgb(255, 255, 255);"></i></span> Alarm Center</button>

        <div class="nav-section-label">Account</div>
        <button class="nav-link" data-page="profile"><span class="ic"><i class="fa-solid fa-address-card" style="color: rgb(255, 255, 255);"></i></span> Profile</button>
        <button class="nav-link" data-page="all_user" data-admin-only="1"><span class="ic"><i class="fa-solid fa-users" style="color: rgb(255, 255, 255);"></i></span> All User</button>

        <div class="sidebar-footer">v0.4 · laser_link_md_x</div>
      </nav>

      <!-- ================= Topbar ================= -->
      <header class="topbar">
        <div class="topbar-title" id="topbar-title">Monitor</div>
        <div class="topbar-clock mono" id="topbar-clock">--/--/---- --:--:--</div>
        <div class="topbar-right">
          <div class="topbar-user">
            <img id="topbar-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3C/svg%3E" alt="" />
            <span id="topbar-username">—</span>
            <span class="role-badge" id="topbar-role">USER</span>
          </div>
          <button class="btn btn-sm" id="logout-btn">Sign out</button>
        </div>
      </header>

      <!-- ================= Content (fragments injected here) ================= -->
      <main class="content" id="content">
        <div class="page-placeholder">Loading…</div>
      </main>

    </div>

    <script src="js/dashboard.js"></script>
  </body>
</html>
