<!-- frontend/pages/model_setting.html -->
<!-- ============================================================
     model_setting.html — loaded into #content by dashboard.js
     Logic lives in dashboard.js, section "FOR MODEL SET PAGE"

     Each pallet card is split into two inner columns:
       col1: photo (row1) + basic detail table (row2)
       col2: model-select dropdown (top) + scrollable editable
             conditions list (bottom)
     ============================================================ -->
<div id="ms-alert-box"></div>

<div class="ms-page-grid">

  <!-- ================= LEFT COLUMN: pallet rows ================= -->
  <div class="ms-col-left">

    <!-- ---- Row 1: Pallet 1 ---- -->
    <div class="card ms-card">
      <div class="ms-pallet-grid">

        <!-- ---- inner column 1: photo (row1) + basic info (row2) ---- -->
        <div class="ms-pallet-col1">
          <div class="ms-pallet-photo-frame" id="ms-photo-Pallet1">
            <div class="ms-photo-placeholder"><i class="fa-regular fa-image"></i><span>No model selected</span></div>
          </div>
          <div class="ms-pallet-info" id="ms-info-Pallet1">
            <div class="ms-empty">Select a job to see its details.</div>
          </div>
        </div>

        <!-- ---- inner column 2: select model + scrollable conditions ---- -->
        <div class="ms-pallet-col2">
          <div class="field">
            <label for="ms-select-Pallet1">Pallet 1</label>
            <select class="ms-pallet-select" id="ms-select-Pallet1" data-pallet="Pallet1">
              <option value="">— select —</option>
            </select>
          </div>
          <div class="ms-pallet-conditions" id="ms-cond-Pallet1">
            <div class="ms-empty">Select a job to see its conditions.</div>
          </div>
        </div>

      </div>
    </div>

    <!-- ---- Row 2: Pallet 2 ---- -->
    <div class="card ms-card">
      <div class="ms-pallet-grid">

        <div class="ms-pallet-col1">
          <div class="ms-pallet-photo-frame" id="ms-photo-Pallet2">
            <div class="ms-photo-placeholder"><i class="fa-regular fa-image"></i><span>No model selected</span></div>
          </div>
          <div class="ms-pallet-info" id="ms-info-Pallet2">
            <div class="ms-empty">Select a job to see its details.</div>
          </div>
        </div>

        <div class="ms-pallet-col2">
          <div class="field">
            <label for="ms-select-Pallet2">Pallet 2</label>
            <select class="ms-pallet-select" id="ms-select-Pallet2" data-pallet="Pallet2">
              <option value="">— select —</option>
            </select>
          </div>
          <div class="ms-pallet-conditions" id="ms-cond-Pallet2">
            <div class="ms-empty">Select a job to see its conditions.</div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- ================= RIGHT COLUMN: reserved for next feature ================= -->
  <div class="ms-col-right">
    <div class="card ms-card ms-placeholder-card">
      <div class="card-title">Reserved</div>
      <div class="ms-empty">Coming soon.</div>
    </div>
  </div>

</div>

<!-- ================= Confirm "Set value" modal (operators) ================= -->
<div class="ms-modal-backdrop" id="ms-confirm-backdrop">
  <div class="ms-modal ms-modal-sm">
    <div class="ms-modal-title">Confirm change</div>
    <p id="ms-confirm-text" style="font-size:13px;color:var(--ink-soft);"></p>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button type="button" class="btn btn-primary" id="ms-confirm-yes-btn">Yes, set it</button>
      <button type="button" class="btn" id="ms-confirm-no-btn">Cancel</button>
    </div>
  </div>
</div>
