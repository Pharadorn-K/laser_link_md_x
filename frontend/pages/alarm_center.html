<!-- frontend/pages/alarm_center.html -->
<div class="ac-tab-bar">
  <button class="ac-tab active" data-tab="current">
    <span data-i18n="alarm.tab.current">Current Alarms</span> <span class="ac-tab-count" id="ac-count-current">0</span>
  </button>
  <button class="ac-tab" data-tab="history">
    <span data-i18n="alarm.tab.history">History Alarms</span> <span class="ac-tab-count" id="ac-count-history">0</span>
  </button>
  <div class="ac-refresh-row">
    <button class="btn btn-sm" id="ac-refresh-btn"><i class="fa-solid fa-rotate"></i> <span data-i18n="alarm.refresh">Refresh</span></button>
    <span class="ac-updated" id="ac-last-updated"></span>
  </div>
</div>

<div class="grid-2 ac-grid">

  <div class="card ac-list-card">
    <div class="card-title" id="ac-list-title" data-i18n="alarm.tab.current">Current Alarms</div>
    <div class="ac-table-wrap">
      <table class="data-table ac-table">
        <thead id="ac-table-head"></thead>
        <tbody id="ac-table-body">
          <tr><td colspan="6" class="eq-queue-empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card ac-detail-card">
    <div class="card-title" data-i18n="alarm.details_title">Alarm Details &amp; Instructions</div>
    <div class="ac-detail-empty" id="ac-detail-empty">
      <i class="fa-regular fa-hand-point-left"></i>
      <span data-i18n="alarm.detail.empty">Select an alarm from the list to see details and recovery steps.</span>
    </div>
    <div class="ac-detail-body" id="ac-detail-body" style="display:none;"></div>
  </div>

</div>
